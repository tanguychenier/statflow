; OPcache — tuned for FrankenPHP worker mode
; In worker mode the PHP process is long-lived, so we pre-load and validate
; less aggressively in production, but keep revalidation on in dev (overridden
; via APP_ENV at runtime when needed).

opcache.enable=1
opcache.enable_cli=1

; Memory budget — 256 MB is comfortable for a mid-sized Symfony app
opcache.memory_consumption=256

; Number of internedstrings — increase if Symfony bootstraps many unique strings
opcache.interned_strings_buffer=32

; Maximum number of cached files
opcache.max_accelerated_files=20000

; Validate file timestamps every N seconds (0 = never; use 0 in prod, 2 in dev)
; compose.yaml sets OPCACHE_REVALIDATE_FREQ=2 for dev
opcache.revalidate_freq=0

; Save the compiled state across restarts (requires opcache.file_cache)
opcache.file_cache=/tmp/opcache
opcache.file_cache_only=0

; JIT — tracing mode, 128 MB buffer
opcache.jit=tracing
opcache.jit_buffer_size=128M
