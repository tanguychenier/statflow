openapi: "3.1.0"

info:
  title: Statflow API
  version: "1.0.0"
  description: |
    REST API for Statflow — a privacy-first, cookieless web and product analytics platform.

    ## Authentication

    Three authentication surfaces are supported:

    - **Session JWT** (`BearerAuth`): issued by `POST /api/v1/auth/login`, transmitted as `Authorization: Bearer {token}`. Used by the dashboard SPA.
    - **API Key** (`ApiKeyAuth`): prefixed `sfk_live_` or `sfk_test_`. Used by programmatic integrations.
    - **Tracker Key** (`TrackerKeyAuth`): prefixed `stk_`. Carried in the event payload `site_key` field (request body, not a header — `sendBeacon` compatibility). Identifies the site for event ingestion. Public by design; validated together with a per-site domain allowlist and rate limiting. See ADR-0009.

    ## Error Model

    All 4xx and 5xx responses use `application/problem+json` (RFC 9457). See the error catalog for all typed error URIs.

    ## Versioning

    All endpoints are prefixed `/api/v1`. Additive changes are non-breaking. Breaking changes result in a new major version with a minimum 12-month deprecation window.
  contact:
    name: Statflow Backend Team
    url: https://statflow.io
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: https://{host}/api/v1
    description: Statflow API v1
    variables:
      host:
        default: app.statflow.io
        description: Your Statflow instance hostname

tags:
  - name: Ingestion
    description: Event ingestion endpoint consumed by the JS tracker and server-side integrations.
  - name: Auth
    description: Session management — login, logout, token refresh, JWKS.
  - name: Users
    description: User account management.
  - name: Teams
    description: Team management — creation, membership, roles.
  - name: API Keys
    description: Programmatic API key management.
  - name: Sites
    description: Site registration and configuration.
  - name: Analytics
    description: Analytics query endpoints — aggregates, time series, top lists, realtime, funnels, cohorts, heatmaps.
  - name: Reporting
    description: Saved reports, scheduled email reports, alerts, and data exports.

# ---------------------------------------------------------------------------
# PATHS
# ---------------------------------------------------------------------------

paths:

  # =========================================================================
  # INGESTION
  # =========================================================================

  /events:
    post:
      operationId: ingestEvent
      summary: Ingest a single event
      description: |
        Accepts a single analytics event from the JS tracker or a server-side integration.
        Returns `204 No Content` on success; the response body is always empty.

        **Authentication**: `TrackerKeyAuth` — the public `site_key` (`stk_...`) carried
        in the payload body. No `Authorization` header. The key is validated together
        with the site's domain allowlist and per-site rate limiting (ADR-0009).

        **Payload**: the canonical event model defined in
        `docs/data-model/event-contract.md`. The browser tracker sends a compact wire
        form; the ingestion layer normalises wire → canonical on receipt. This schema
        documents the canonical form, which server-side integrations may send directly.

        **Idempotency**: include a unique `event_id` (UUID v4). Replaying the same
        `event_id` within 24 hours silently returns `204` without re-inserting the event.

        **CORS**: this endpoint accepts requests from any origin (`Access-Control-Allow-Origin: *`).
      tags:
        - Ingestion
      security:
        - TrackerKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventPayload"
            examples:
              pageview:
                summary: Page view event (canonical form)
                value:
                  event_id: "8f14e45f-ce64-4f1a-9b2d-2c3a4b5c6d7e"
                  site_key: "stk_abcdef1234567890"
                  event_name: "pageview"
                  timestamp: "2025-06-15T14:30:00.123Z"
                  seq: 0
                  tracker_version: "1.0.0"
                  url: "https://example.com/blog/post-1"
                  pathname: "/blog/post-1"
                  hostname: "example.com"
                  title: "Post 1 — Example Blog"
                  referrer: "https://www.google.com/"
                  screen_width: 2560
                  screen_height: 1600
                  viewport_width: 1440
                  viewport_height: 900
                  language: "fr-FR"
                  timezone: "Europe/Paris"
              click:
                summary: Click event with behavioral signals
                value:
                  event_id: "1d2e3f40-5a6b-4c7d-8e9f-0a1b2c3d4e5f"
                  site_key: "stk_abcdef1234567890"
                  event_name: "click"
                  timestamp: "2025-06-15T14:30:05.456Z"
                  seq: 7
                  tracker_version: "1.0.0"
                  url: "https://example.com/pricing"
                  pathname: "/pricing"
                  hostname: "example.com"
                  viewport_width: 1440
                  viewport_height: 900
                  behavioral:
                    click_x: 742
                    click_y: 318
                    click_x_pct: 51.5
                    click_y_pct: 35.3
                    element_tag: "button"
                    element_text: "Start free trial"
                    element_selector: "main > section.pricing .cta-button"
                    scroll_depth_pct: 42
                    engagement_time_ms: 8340
          text/plain:
            schema:
              $ref: "#/components/schemas/EventPayload"
      responses:
        "204":
          description: |
            Event accepted for ingestion. The response body is empty. Replayed
            `event_id` values within the 24-hour idempotency window also return `204`.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /events/batch:
    post:
      operationId: ingestEventBatch
      summary: Ingest a batch of events
      description: |
        Accepts the unified batch envelope (root key `events`) with up to 100 events.
        Each event is validated independently. Returns `204` if every event was
        accepted, `200` with a per-item `results` body if some events were rejected,
        or `400`/`422` if the whole envelope is malformed.

        Batch limit: 100 events or 256 KB, whichever is reached first.

        Authentication and payload semantics are identical to `POST /events`.
      tags:
        - Ingestion
      security:
        - TrackerKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventBatch"
          text/plain:
            schema:
              $ref: "#/components/schemas/EventBatch"
      responses:
        "204":
          description: All events in the batch were accepted for ingestion.
        "200":
          description: |
            The batch was processed; some events were accepted and some were rejected.
            This is a normal success response (not a Problem Details object): the body
            lists per-item status so the caller can retry only the failed events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResultResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # =========================================================================
  # AUTH
  # =========================================================================

  /auth/login:
    post:
      operationId: login
      summary: Authenticate with email and password
      description: |
        Validates credentials and returns a short-lived JWT access token in the response body.
        Sets an `HttpOnly`, `SameSite=Strict`, `Secure` refresh token cookie.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
                  writeOnly: true
      responses:
        "200":
          description: Login successful.
          headers:
            Set-Cookie:
              description: "Refresh token in an HttpOnly cookie named `sf_rt`."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/register:
    post:
      operationId: register
      summary: Create a new user account
      description: |
        Registers a new user with email and password. On success, a verification email
        is dispatched and the account is created in an unverified state. The user may
        log in immediately; email verification is required to invite team members or
        manage billing.

        Password policy: minimum **12 characters** (ADR-0009 §2).
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
                  writeOnly: true
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Display name shown in team member lists.
      responses:
        "201":
          description: |
            Account created. Returns the new user profile. A verification email has
            been dispatched; the `email_verified` field will be `false` until confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request a password reset link
      description: |
        Sends a one-time password reset link to the supplied email address if an account
        with that address exists. The response is always `202 Accepted` regardless of
        whether the address is registered — this prevents user enumeration. The link
        expires after **1 hour** and is single-use.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        "202":
          description: |
            Request accepted. If the address matches a registered account, a reset link
            will be sent. No indication is given as to whether the address exists.
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Complete a password reset using a one-time token
      description: |
        Validates the reset token (from the link emailed by `POST /auth/forgot-password`)
        and sets a new password. The token is consumed on first use and becomes invalid.
        All existing sessions for the account are revoked on success.

        Password policy: minimum **12 characters** (ADR-0009 §2).
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - new_password
              properties:
                token:
                  type: string
                  description: |
                    The opaque reset token extracted from the link sent by
                    `POST /auth/forgot-password`. Tokens are single-use and expire
                    after 1 hour.
                  minLength: 32
                  maxLength: 256
                  writeOnly: true
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 128
                  writeOnly: true
      responses:
        "204":
          description: |
            Password reset successfully. All existing sessions have been revoked.
            The user must log in again via `POST /auth/login`.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: |
            The reset token is invalid, expired, or has already been used.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: "https://statflow.io/errors/token-revoked"
                title: "Token Revoked"
                status: 401
                detail: "The password reset token is invalid, expired, or has already been used."
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      operationId: logout
      summary: Invalidate the current session
      description: |
        Revokes the refresh token server-side and clears the cookie. The access token
        remains technically valid until its 15-minute TTL expires; the client must discard it.
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Session successfully invalidated.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Obtain a new access token using the refresh token cookie
      description: |
        The refresh token is read from the `sf_rt` cookie (set during login). On success,
        the refresh token is rotated (old one revoked) and a new one is set in the cookie.
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: New access token issued.
          headers:
            Set-Cookie:
              description: "Rotated refresh token in `sf_rt` HttpOnly cookie."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/.well-known/jwks.json:
    get:
      operationId: getJwks
      summary: Retrieve the public key set for JWT verification
      description: Returns the ES256 public keys used to sign access tokens.
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: JWKS document.
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  # =========================================================================
  # USERS
  # =========================================================================

  /users/me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user's profile
      tags:
        - Users
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: User profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      operationId: updateCurrentUser
      summary: Update the authenticated user's profile
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: Updated user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /users/me/password:
    put:
      operationId: changePassword
      summary: Change the current user's password
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                  writeOnly: true
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 128
                  writeOnly: true
      responses:
        "204":
          description: Password changed successfully. All existing sessions are revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # =========================================================================
  # TEAMS
  # =========================================================================

  /teams:
    get:
      operationId: listTeams
      summary: List teams the current user belongs to
      tags:
        - Teams
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated list of teams.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: createTeam
      summary: Create a new team
      tags:
        - Teams
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamCreateRequest"
      responses:
        "201":
          description: Team created. The creator is automatically assigned the Owner role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /teams/{team_id}:
    parameters:
      - $ref: "#/components/parameters/TeamIdParam"

    get:
      operationId: getTeam
      summary: Get a team by ID
      tags:
        - Teams
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: Team details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateTeam
      summary: Update a team (Owner/Admin only)
      tags:
        - Teams
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdateRequest"
      responses:
        "200":
          description: Updated team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      operationId: deleteTeam
      summary: Delete a team and all its data (Owner only)
      tags:
        - Teams
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Team deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /teams/{team_id}/members:
    parameters:
      - $ref: "#/components/parameters/TeamIdParam"

    get:
      operationId: listTeamMembers
      summary: List team members
      tags:
        - Teams
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated list of team members.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/TeamMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      operationId: inviteTeamMember
      summary: Invite a user to the team (Owner/Admin only)
      tags:
        - Teams
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - role
              properties:
                email:
                  type: string
                  format: email
                role:
                  $ref: "#/components/schemas/TeamRole"
      responses:
        "201":
          description: Invitation sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /teams/{team_id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/TeamIdParam"
      - name: user_id
        in: path
        required: true
        schema:
          type: string

    patch:
      operationId: updateTeamMemberRole
      summary: Change a member's role (Owner/Admin only)
      tags:
        - Teams
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  $ref: "#/components/schemas/TeamRole"
      responses:
        "200":
          description: Updated membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      operationId: removeTeamMember
      summary: Remove a member from the team (Owner/Admin only)
      tags:
        - Teams
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Member removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================================================================
  # API KEYS
  # =========================================================================

  /api-keys:
    get:
      operationId: listApiKeys
      summary: List API keys for the authenticated user
      tags:
        - API Keys
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated list of API keys. Raw key values are never returned after creation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: createApiKey
      summary: Create a new API key
      description: |
        Returns the raw key value **once** in the `raw_key` field. Store it securely;
        it cannot be retrieved again. Subsequent reads return only the masked form.
      tags:
        - API Keys
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyCreateRequest"
      responses:
        "201":
          description: "API key created. Contains `raw_key` — store this value now."
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiKey"
                  - type: object
                    properties:
                      raw_key:
                        type: string
                        description: "Full API key value, shown once. Example: sfk_live_..."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api-keys/{key_id}:
    parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string

    delete:
      operationId: revokeApiKey
      summary: Revoke an API key
      tags:
        - API Keys
      security:
        - BearerAuth: []
      responses:
        "204":
          description: API key revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================================================================
  # SITES
  # =========================================================================

  /sites:
    get:
      operationId: listSites
      summary: List sites accessible to the authenticated identity
      tags:
        - Sites
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: team_id
          in: query
          description: Filter sites by team.
          schema:
            type: string
        - name: search
          in: query
          description: Full-text search on site name and domain.
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Paginated list of sites.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Site"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      operationId: createSite
      summary: Register a new site
      tags:
        - Sites
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteCreateRequest"
      responses:
        "201":
          description: "Site created. Response includes the tracker key (`tracker_key`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /sites/{site_id}:
    parameters:
      - $ref: "#/components/parameters/SiteIdParam"

    get:
      operationId: getSite
      summary: Get a site by ID
      tags:
        - Sites
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: Site details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateSite
      summary: Update site metadata (Admin/Owner only)
      tags:
        - Sites
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteUpdateRequest"
      responses:
        "200":
          description: Updated site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      operationId: deleteSite
      summary: Delete a site and all its analytical data (Owner only)
      description: |
        This is a destructive, irreversible operation. All ClickHouse event data for this site
        is scheduled for deletion. The operation is asynchronous; data removal may take up to
        24 hours to propagate through the pipeline.
      tags:
        - Sites
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Site deletion scheduled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /sites/{site_id}/settings:
    parameters:
      - $ref: "#/components/parameters/SiteIdParam"

    get:
      operationId: getSiteSettings
      summary: Get site configuration settings
      tags:
        - Sites
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: Site settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateSiteSettings
      summary: Replace site configuration settings (Admin/Owner only)
      tags:
        - Sites
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettings"
      responses:
        "200":
          description: Updated site settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /sites/{site_id}/tracker-key/rotate:
    parameters:
      - $ref: "#/components/parameters/SiteIdParam"

    post:
      operationId: rotateTrackerKey
      summary: Rotate the tracker key for a site (Admin/Owner only)
      description: |
        Issues a new tracker key and revokes the old one. The old key remains valid for
        a 1-hour grace period to allow deployed tracker scripts to transition.
      tags:
        - Sites
      security:
        - BearerAuth: []
      responses:
        "200":
          description: New tracker key issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tracker_key:
                    type: string
                    description: New tracker key (stk_...).
                  old_key_valid_until:
                    type: string
                    format: date-time
                    description: UTC timestamp when the old key is fully revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================================================================
  # GOALS
  # =========================================================================

  /sites/{site_id}/goals:
    parameters:
      - $ref: "#/components/parameters/SiteIdParam"
    get:
      operationId: listGoals
      summary: List conversion goals for a site
      description: |
        Goals are persisted resources (`postgres.goals`). A goal matches either a
        pageview URL pattern or a custom event name; matching events produce a
        derived `conversion` event for rollups (see `event-contract.md §8`).
      tags:
        - Analytics
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: List of goals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Goal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createGoal
      summary: Create a conversion goal
      tags:
        - Analytics
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalCreateRequest"
      responses:
        "201":
          description: Goal created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /sites/{site_id}/goals/{goal_id}:
    parameters:
      - $ref: "#/components/parameters/SiteIdParam"
      - name: goal_id
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateGoal
      summary: Update a conversion goal
      tags:
        - Analytics
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalCreateRequest"
      responses:
        "200":
          description: Goal updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteGoal
      summary: Delete a conversion goal
      tags:
        - Analytics
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "204":
          description: Goal deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================================================================
  # PUBLIC SHARED DASHBOARD
  # =========================================================================

  /public/{share_token}/overview:
    parameters:
      - name: share_token
        in: path
        required: true
        description: The opaque share token from `sites.shared_link_token`.
        schema:
          type: string
    get:
      operationId: getPublicOverview
      summary: Public, unauthenticated read of a site's shared dashboard
      description: |
        Backs the public shared dashboard (Screen 8). Available only when the
        site has `public_stats` enabled. This is the single endpoint with no
        authenticated principal; access is gated by possession of the
        unguessable `share_token` plus, if set, the share password.

        If the share link is password-protected, the caller must supply the
        password via the `X-Share-Password` header; an incorrect or missing
        password yields `401`.
      tags:
        - Analytics
      security: []
      parameters:
        - name: X-Share-Password
          in: header
          required: false
          description: Password for a password-protected share link.
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Public overview metrics for the shared site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregateMetricsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # =========================================================================
  # ANALYTICS
  # =========================================================================

  /analytics/{site_id}/aggregate:
    parameters:
      - $ref: "#/components/parameters/SiteIdParam"
    post:
      operationId: getAggregateMetrics
      summary: Get aggregate metrics for a date range
      description: |
        Returns summary metrics (visitors, pageviews, sessions, bounce rate, avg session
        duration) for the specified period. Supports comparison periods.
      tags:
        - Analytics
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsQueryBase"
            example:
              date_from: "2025-06-01"
              date_to: "2025-06-30"
              metrics:
                - visitors
                - pageviews
                - sessions
                - bounce_rate
                - avg_duration
              compare_period: "previous_period"
      responses:
        "200":
          description: Aggregate metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregateMetricsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /analytics/{site_id}/timeseries:
    parameters:
      - $ref: "#/components/parameters/SiteIdParam"
    post:
      operationId: getTimeSeries
      summary: Get metric time series
      description: |
        Returns one or more metrics bucketed by time interval (minute, hour, day, week, month).
        The interval is automatically selected based on the date range if not specified.
      tags:
        - Analytics
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AnalyticsQueryBase"
                - type: object
                  properties:
                    interval:
                      type: string
                      enum: [minute, hour, day, week, month]
                      description: Time bucket size. Auto-selected if omitted.
                    metrics:
                      type: array
                      items:
                        $ref: "#/components/schemas/MetricName"
      responses:
        "200":
          description: Time series data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeSeriesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /analytics/{site_id}/breakdown:
    parameters:
      - $ref: "#/components/parameters/SiteIdParam"
    post:
      operationId: getBreakdown
      summary: Get metrics broken down by a property (top pages, sources, devices, countries, etc.)
      description: |
        Returns metric values broken down by a single dimension property, ordered by the
        primary metric descending (configurable). This single endpoint replaces separate
        "top pages", "top sources", "top devices", "top countries" endpoints.

        `property` can be any filterable dimension: `pathname`, `referrer_domain`,
        `utm_source`, `utm_medium`, `utm_campaign`, `country`, `region`, `city`,
        `device_type`, `browser`, `os`, `language`, `entry_page`, `exit_page`, `event_name`.
      tags:
        - Analytics
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AnalyticsQueryBase"
                - type: object
                  required:
                    - property
                  properties:
                    property:
                      type: string
                      description: Dimension to break down by.
                      example: pathname
                    metrics:
                      type: array
                      items:
                        $ref: "#/components/schemas/MetricName"
                    limit:
                      type: integer
                      minimum: 1
                      maximum: 1000
                      default: 100
                    sort_by:
                      $ref: "#/components/schemas/MetricName"
                    sort_order:
                      type: string
                      enum: [asc, desc]
                      default: desc
      responses:
        "200":
          description: Breakdown result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakdownResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /analytics/{site_id}/realtime:
    parameters:
      - $ref: "#/components/parameters/SiteIdParam"
    get:
      operationId: getRealtimeStats
      summary: Get current realtime visitor stats (last 5 minutes)
      tags:
        - Analytics
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: Realtime stats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /analytics/{site_id}/realtime/stream:
    parameters:
      - $ref: "#/components/parameters/SiteIdParam"
    get:
      operationId: streamRealtime
      summary: Server-Sent Events stream of realtime stats and live events
      description: |
        A long-lived **Server-Sent Events** (`text/event-stream`) connection backing
        the Realtime screen. The window is the **last 5 minutes** (ADR / canonical
        decision: realtime window = 5 minutes), consistent with `GET .../realtime`.

        Two named event types are emitted on the stream:

        - `stats` — a `RealtimeResponse` object, pushed every ~2 seconds.
        - `event` — a `RealtimeEvent` object, one per newly ingested event, for the
          live event-stream panel (newest first, client keeps at most 200 rows).

        Authentication is by `BearerAuth` (the SPA passes the access token as a query
        parameter `access_token` because `EventSource` cannot set headers) or by
        `ApiKeyAuth`. The connection is closed by the server on token expiry; the
        client reconnects with a fresh token.
      tags:
        - Analytics
      parameters:
        - name: access_token
          in: query
          required: false
          description: JWT access token, for `EventSource` clients that cannot set an `Authorization` header.
          schema:
            type: string
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: An open SSE stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE framing. Each message is `event: stats|event` followed by a
                  `data:` line containing a JSON `RealtimeResponse` or `RealtimeEvent`.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /sites/{site_id}/funnels:
    parameters:
      - $ref: "#/components/parameters/SiteIdParam"
    get:
      operationId: listFunnels
      summary: List saved funnels for a site
      description: |
        Funnels are first-class persisted resources (`postgres.funnels` / `funnel_steps`).
        A saved funnel has a stable `id` used by the ClickHouse `funnel_events` table
        and by `POST /analytics/{site_id}/funnels`.
      tags:
        - Analytics
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: List of saved funnels.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Funnel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createFunnel
      summary: Create a saved funnel
      description: |
        Creating a funnel makes its steps available to the ingestion-time
        `funnel_events` fan-out. A nightly backfill job populates `funnel_events`
        with matching historical events for the new funnel.
      tags:
        - Analytics
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FunnelCreateRequest"
      responses:
        "201":
          description: Funnel created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Funnel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /sites/{site_id}/funnels/{funnel_id}:
    parameters:
      - $ref: "#/components/parameters/SiteIdParam"
      - name: funnel_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getFunnel
      summary: Get a saved funnel
      tags:
        - Analytics
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: The saved funnel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Funnel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateFunnel
      summary: Update a saved funnel
      tags:
        - Analytics
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FunnelCreateRequest"
      responses:
        "200":
          description: Funnel updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Funnel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteFunnel
      summary: Delete a saved funnel
      tags:
        - Analytics
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "204":
          description: Funnel deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /analytics/{site_id}/funnels:
    parameters:
      - $ref: "#/components/parameters/SiteIdParam"
    post:
      operationId: queryFunnel
      summary: Run a funnel analysis
      description: |
        Calculates conversion rates through an ordered sequence of steps (2–16).
        The request must reference a **saved funnel** by `funnel_id` (created via
        `POST /sites/{site_id}/funnels`). The funnel's steps are pre-materialised into
        the ClickHouse `funnel_events` table, so the query is fast and exact. Steps are
        ordered: each must occur in sequence within a session or within a configurable
        conversion window.
      tags:
        - Analytics
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FunnelQueryRequest"
            example:
              date_from: "2025-06-01"
              date_to: "2025-06-30"
              funnel_id: "01HXK2Q4B7T8NMPZW6RDYGJ5ZZ"
              conversion_window_days: 7
      responses:
        "200":
          description: Funnel analysis result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FunnelResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /analytics/{site_id}/retention:
    parameters:
      - $ref: "#/components/parameters/SiteIdParam"
    post:
      operationId: queryRetention
      summary: Run a retention / cohort analysis
      description: |
        Calculates user retention cohorts. Users are grouped by their first-event date
        (weekly or monthly cohorts) and retention is measured by return visits/events
        in subsequent periods.
      tags:
        - Analytics
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionQueryRequest"
      responses:
        "200":
          description: Retention cohort table.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /analytics/{site_id}/heatmap:
    parameters:
      - $ref: "#/components/parameters/SiteIdParam"
    post:
      operationId: queryHeatmap
      summary: Get click/scroll heatmap data for a page
      description: |
        Returns click point coordinates and scroll depth aggregates for a specific
        pathname and viewport width range. Used to render heatmap overlays in the dashboard.

        Click points are returned as aggregated buckets (not raw coordinates) to protect
        privacy and reduce payload size. Each bucket represents a 10x10 px grid cell
        normalised to the page's rendered dimensions.
      tags:
        - Analytics
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeatmapQueryRequest"
            example:
              date_from: "2025-06-01"
              date_to: "2025-06-30"
              pathname: "/pricing"
              viewport_width_min: 1024
              viewport_width_max: 1920
      responses:
        "200":
          description: Heatmap data.
          content:
            application/json:
