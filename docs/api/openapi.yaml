# ---------------------------------------------------------------------------
# COMPONENTS
# ---------------------------------------------------------------------------

components:

  # =========================================================================
  # SECURITY SCHEMES
  # =========================================================================

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived JWT access token (ES256, 15-minute TTL). Obtain via `POST /auth/login` or
        `POST /auth/refresh`. Transmitted as `Authorization: Bearer {token}`.

    ApiKeyAuth:
      type: http
      scheme: bearer
      description: |
        Programmatic API key. Prefixed `sfk_live_` (production) or `sfk_test_` (sandbox).
        Transmitted as `Authorization: Bearer sfk_live_...`.

    TrackerKeyAuth:
      type: http
      scheme: bearer
      description: |
        Tracker key embedded in event payload `site_key` field. Prefixed `stk_`. Public by design.

  # =========================================================================
  # PARAMETERS
  # =========================================================================

  parameters:
    SiteIdParam:
      name: site_id
      in: path
      required: true
      description: UUID of the site.
      schema:
        type: string
        format: uuid
        example: "3f1a9b2d-2c3a-4b5c-8e9f-0a1b2c3d4e5f"

    TeamIdParam:
      name: team_id
      in: path
      required: true
      description: UUID of the team.
      schema:
        type: string
        format: uuid
        example: "7c2e4a16-5b3d-4e8f-9a0b-1c2d3e4f5061"

    CursorParam:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor from a previous response.
      schema:
        type: string

    LimitParam:
      name: limit
      in: query
      required: false
      description: Number of items per page (1–100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  # =========================================================================
  # SCHEMAS
  # =========================================================================

  schemas:

    # -----------------------------------------------------------------------
    # INGESTION
    # -----------------------------------------------------------------------

    EventPayload:
      type: object
      description: |
        The **canonical** event model — the single source of truth is
        `docs/data-model/event-contract.md` (ADR-0007). The browser tracker sends a
        compact wire form with short keys; the ingestion layer normalises wire →
        canonical on receipt. This schema is the canonical form, which server-side
        integrations may submit directly.

        Server-derived fields (`visitor_id`, `session_id`, geo, `referrer_source`,
        device/browser/OS) are NOT part of this schema: they are computed by the
        ingestion layer and never accepted from the client (ADR-0008).
      required:
        - event_id
        - site_key
        - event_name
        - timestamp
        - seq
        - url
        - pathname
        - hostname
      properties:
        event_id:
          type: string
          description: Client-generated unique event identifier (UUID v4). Used for deduplication.
          example: "8f14e45f-ce64-4f1a-9b2d-2c3a4b5c6d7e"
          maxLength: 36

        site_key:
          type: string
          description: "Public tracker key identifying the site (ADR-0009). Prefix `stk_`."
          example: "stk_abcdef1234567890"

        event_name:
          type: string
          description: |
            Name of the event. Drawn from the closed vocabulary in
            `event-contract.md §4`: `pageview`, `route_change`, `engagement`, `click`,
            `rage_click`, `dead_click`, `scroll_depth`, `form_focus`, `form_submit`,
            `form_abandon`, `element_visibility`, `custom`, `conversion`,
            `web_vital_lcp`, `web_vital_cls`, `web_vital_inp`, `js_error`,
            `heatmap_batch`. Custom event names must not start with `sf_` (reserved).
          example: "pageview"
          minLength: 1
          maxLength: 100

        seq:
          type: integer
          description: Monotonic per-session sequence counter, used to reconstruct ordered event streams.
          minimum: 0
          example: 4

        tracker_version:
          type: string
          description: Version of the tracker build that produced the event.
          maxLength: 20
          example: "1.0.0"

        timestamp:
          type: string
          format: date-time
          description: Client-side UTC timestamp when the event occurred (millisecond precision).
          example: "2025-06-15T14:30:00.123Z"

        url:
          type: string
          format: uri
          description: "Full URL of the page where the event occurred. Query strings are stripped server-side if `strip_query_params` is enabled in site settings."
          maxLength: 2048
          example: "https://example.com/blog/post-1?utm_source=twitter"

        pathname:
          type: string
          description: URL path component, without query string or fragment.
          maxLength: 2048
          example: "/blog/post-1"

        hostname:
          type: string
          description: Hostname component of the URL.
          maxLength: 253
          example: "example.com"

        referrer:
          type: string
          format: uri
          description: Full referrer URL. Omit or send empty string for direct traffic.
          maxLength: 2048

        referrer_domain:
          type: string
          description: Hostname of the referrer. Derived server-side if not provided.
          maxLength: 253
          example: "google.com"

        utm_source:
          type: string
          maxLength: 200
          example: "newsletter"

        utm_medium:
          type: string
          maxLength: 200
          example: "email"

        utm_campaign:
          type: string
          maxLength: 200
          example: "june-launch"

        utm_term:
          type: string
          maxLength: 200

        utm_content:
          type: string
          maxLength: 200

        title:
          type: string
          description: "`document.title` at capture time."
          maxLength: 512
          example: "Pricing — Acme"

        screen_width:
          type: integer
          description: Screen width in CSS pixels (`screen.width`).
          minimum: 0
          maximum: 20000
          example: 2560

        screen_height:
          type: integer
          description: Screen height in CSS pixels (`screen.height`).
          minimum: 0
          maximum: 20000
          example: 1600

        viewport_width:
          type: integer
          description: Viewport width in CSS pixels at capture time.
          minimum: 0
          maximum: 20000
          example: 1440

        viewport_height:
          type: integer
          description: Viewport height in CSS pixels at capture time.
          minimum: 0
          maximum: 20000
          example: 900

        device_pixel_ratio:
          type: number
          description: "`window.devicePixelRatio`, rounded."
          minimum: 0

        connection_type:
          type: string
          description: "`effectiveType` from the NetworkInformation API, when available."
          maxLength: 16
          example: "4g"

        language:
          type: string
          description: "BCP 47 language tag from `navigator.language`."
          maxLength: 35
          example: "fr-FR"

        timezone:
          type: string
          description: IANA timezone identifier.
          maxLength: 50
          example: "Europe/Paris"

        behavioral:
          $ref: "#/components/schemas/BehavioralSignals"

        custom_properties:
          type: object
          description: |
            Arbitrary key-value pairs for custom event properties. Keys must match `[a-z0-9_]{1,50}`.
            Values must be strings, numbers, or booleans. Maximum 20 properties per event.
            Total serialised size of custom_properties must not exceed 4 KB.
          additionalProperties:
            oneOf:
              - type: string
                maxLength: 1000
              - type: number
              - type: boolean
          maxProperties: 20

    BehavioralSignals:
      type: object
      description: |
        Behavioral tracking signals attached to `click`, `rage_click`, `dead_click`,
        `scroll_depth`, and `engagement` events. See `event-contract.md §5`.
      properties:
        click_x:
          type: integer
          description: |
            Click X coordinate in CSS pixels, **document-relative** (`clientX + scrollX`),
            so it remains valid after scroll. One coordinate origin is used end to end.
          minimum: 0

        click_y:
          type: integer
          description: Click Y coordinate in CSS pixels, document-relative (`clientY + scrollY`).
          minimum: 0

        click_x_pct:
          type: number
          format: float
          description: |
            `click_x` as a percentage of total document width (0–100). The stable
            cross-resolution representation; basis for the heatmap grid.
          minimum: 0
          maximum: 100

        click_y_pct:
          type: number
          format: float
          description: "`click_y` as a percentage of total document height (0–100)."
          minimum: 0
          maximum: 100

        element_tag:
          type: string
          description: HTML tag name of the clicked element (lowercased).
          maxLength: 50
          example: "button"

        element_text:
          type: string
          description: Visible text content of the clicked element (trimmed, max 200 chars).
          maxLength: 200
          example: "Start free trial"

        element_selector:
          type: string
          description: CSS selector path of the clicked element (auto-generated by tracker).
          maxLength: 500
          example: "main > section.pricing .cta-button"

        element_id:
          type: string
          description: "`id` attribute of the clicked element, if present."
          maxLength: 200

        scroll_depth_pct:
          type: integer
          description: Scroll-depth threshold crossed, or maximum depth reached, as a percentage (0–100).
          minimum: 0
          maximum: 100

        scroll_depth_px:
          type: integer
          description: Absolute vertical scroll offset in CSS pixels.
          minimum: 0

        engagement_time_ms:
          type: integer
          description: Active engagement time in milliseconds (tab focused and user active) since the last heartbeat.
          minimum: 0

        is_rage_click:
          type: boolean
          description: |
            Set by the tracker when this click is part of a rage-click burst
            (≥ 3 clicks on the same target within 1000 ms). Backend-validated before storage.

    EventBatch:
      type: object
      description: |
        The unified batch envelope (`event-contract.md §3`). Root key `events`.
        Used by `POST /events/batch` and accepted by `POST /events` with a single entry.
      required:
        - events
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/EventPayload"
        sent_at:
          type: string
          format: date-time
          description: Timestamp when the batch was dispatched by the client.
        sdk:
          type: string
          description: SDK identifier.
          example: "tracker"
        sdk_v:
          type: string
          description: SDK version.
          example: "1.0.0"

    BatchResultResponse:
      type: object
      description: |
        Returned with `200 OK` from `POST /events/batch` when some events were
        rejected. A normal success body — not an RFC 9457 Problem Details object.
      required:
        - accepted
        - rejected
        - results
      properties:
        accepted:
          type: integer
          description: Number of events accepted for ingestion.
        rejected:
          type: integer
          description: Number of events rejected by validation.
        results:
          type: array
          items:
            type: object
            required:
              - index
              - status
            properties:
              index:
                type: integer
                description: 0-based index of the event within the submitted batch.
              status:
                type: string
                enum: [accepted, rejected]
              code:
                type: string
                description: Error slug when `status` is `rejected`.
              errors:
                type: array
                items:
                  $ref: "#/components/schemas/FieldError"

    # -----------------------------------------------------------------------
    # AUTH
    # -----------------------------------------------------------------------

    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: JWT access token (ES256, 15-minute TTL).
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds until the access token expires.
          example: 900

    # -----------------------------------------------------------------------
    # USERS
    # -----------------------------------------------------------------------

    User:
      type: object
      properties:
        id:
          type: string
          description: UUID.
        email:
          type: string
          format: email
        name:
          type: string
          maxLength: 200
        avatar_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254

    # -----------------------------------------------------------------------
    # TEAMS
    # -----------------------------------------------------------------------

    Team:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
          description: URL-safe unique identifier for the team.
        member_count:
          type: integer
        site_count:
          type: integer
        current_user_role:
          $ref: "#/components/schemas/TeamRole"
        created_at:
          type: string
          format: date-time

    TeamCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100

    TeamUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100

    TeamMember:
      type: object
      properties:
        id:
          type: string
          description: Membership record UUID.
        user_id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/TeamRole"
        status:
          type: string
          enum: [active, invited, suspended]
        joined_at:
          type: string
          format: date-time

    TeamRole:
      type: string
      enum: [owner, admin, editor, viewer]
      description: |
        Four team roles (ADR-0009):
        - `owner`: Full control including billing and team deletion. One per team.
        - `admin`: Site management, member invite/remove, API-key management, all data.
        - `editor`: Create/edit sites, goals, funnels, segments, reports. No member or billing management.
        - `viewer`: Read-only access to dashboards, analytics, and saved reports.

    # -----------------------------------------------------------------------
    # API KEYS
    # -----------------------------------------------------------------------

    ApiKey:
      type: object
      properties:
        id:
          type: string
          description: UUID.
        name:
          type: string
          description: Human-readable label.
        key_prefix:
          type: string
          description: "First 12 characters of the key (masked). e.g. `sfk_live_xxxx`."
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        site_ids:
          type: array
          description: List of site IDs this key is restricted to. Empty array means all sites in the team.
          items:
            type: string
        expires_at:
          type: ["string", "null"]
          format: date-time
          description: Expiry timestamp, or null for no expiry.
        last_used_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    ApiKeyCreateRequest:
      type: object
      required:
        - name
        - scopes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        site_ids:
          type: array
          description: Restrict key to these site IDs. Omit or empty for all sites in the team.
          items:
            type: string
        expires_at:
          type: ["string", "null"]
          format: date-time
          description: Optional expiry. Null or omitted = never expires.

    ApiKeyScope:
      type: string
      enum:
        - analytics:read
        - sites:read
        - sites:write
        - reports:read
        - reports:write

    # -----------------------------------------------------------------------
    # SITES
    # -----------------------------------------------------------------------

    Site:
      type: object
      properties:
        id:
          type: string
          description: UUID.
        team_id:
          type: string
        name:
          type: string
        domain:
          type: string
          description: "Primary domain (e.g. `example.com`)."
        tracker_key:
          type: string
          description: "Tracker key (`stk_...`) for use in the JS snippet."
        timezone:
          type: string
          description: IANA timezone for display in the dashboard.
          example: "Europe/Paris"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SiteCreateRequest:
      type: object
      required:
        - team_id
        - name
        - domain
      properties:
        team_id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 200
        domain:
          type: string
          description: "Primary domain without scheme (e.g., `example.com`)."
          maxLength: 253
        timezone:
          type: string
          description: "IANA timezone. Defaults to `UTC`."
          default: "UTC"

    SiteUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        domain:
          type: string
          maxLength: 253
        timezone:
          type: string

    SiteSettings:
      type: object
      description: Full configuration for a site. Use PUT to replace the entire settings object.
      properties:
        allowed_domains:
          type: array
          description: "Domains/origins allowed to send events. Wildcards supported (e.g., `*.example.com`). Leave empty to allow all origins (not recommended for production)."
          items:
            type: string
          maxItems: 50

        excluded_ips:
          type: array
          description: IPv4/IPv6 addresses or CIDR ranges to exclude from tracking.
          items:
            type: string
          maxItems: 100

        data_retention_days:
          type: integer
          description: How many days of event data to retain in ClickHouse. Minimum 30, maximum 730.
          minimum: 30
          maximum: 730
          default: 365

        strip_query_params:
          type: boolean
          description: "Strip query string parameters from `url` and `pathname` before storage."
          default: false

        custom_domain_enabled:
          type: boolean
          description: Whether to track across custom domains mapped to the same site.
          default: false

        tracker_config:
          $ref: "#/components/schemas/TrackerConfig"

    TrackerConfig:
      type: object
      description: Controls what the JS tracker collects.
      properties:
        track_clicks:
          type: boolean
          description: Automatically capture click events with behavioral signals.
          default: true

        track_scroll:
          type: boolean
          description: Capture scroll depth on pageview.
          default: true

        track_engagement_time:
          type: boolean
          description: Measure active engagement time per page.
          default: true

        track_outbound_links:
          type: boolean
          description: Fire events when users click external links.
          default: true

        hash_based_routing:
          type: boolean
          description: |
            Track `#hash` changes as SPA navigations (`route_change` events).
            Matches `site_settings.hash_based_routing` in the PostgreSQL schema.
          default: false

        ignored_selectors:
          type: array
          description: CSS selectors of elements to exclude from click tracking.
          items:
            type: string
          maxItems: 50

        sampling_rate:
          type: number
          format: float
          description: |
            Per-session client-side sampling rate (0.0–1.0). Evaluated once per
            session and held in tracker memory; 1.0 = track every session,
            0.25 = track a random 25% of sessions, 0.0 = track nothing. This is
            the only sampling the cookieless tracker can do without client state
            (it has no `visitor_id` — that is server-derived). Matches
            `site_settings.sampling_rate` (range 0.000–1.000).
          minimum: 0.0
          maximum: 1.0
          default: 1.0

    # -----------------------------------------------------------------------
    # ANALYTICS — SHARED
    # -----------------------------------------------------------------------

    AnalyticsQueryBase:
      type: object
      required:
        - date_from
        - date_to
      properties:
        date_from:
          type: string
          format: date
          description: "Start of the query range (inclusive), in `YYYY-MM-DD` format."
          example: "2025-06-01"

        date_to:
          type: string
          format: date
          description: "End of the query range (inclusive), in `YYYY-MM-DD` format."
          example: "2025-06-30"

        compare_period:
          type: string
          description: |
            Optional comparison period. `previous_period` uses the same-length period
            immediately before `date_from`. `previous_year` uses the same calendar dates
            one year prior.
          enum: [previous_period, previous_year]

        filters:
          type: array
          description: Array of filter conditions applied to all query results.
          items:
            $ref: "#/components/schemas/Filter"

        filter_combination:
          type: string
          enum: [and, or]
          default: and
          description: "Boolean combination of the top-level `filters` array."

        segment_id:
          type: string
          description: "Apply a saved segment. Merged with any inline `filters` via `and`."

        metrics:
          type: array
          description: Metrics to compute. Defaults to all standard metrics if omitted.
          items:
            $ref: "#/components/schemas/MetricName"

    Filter:
      type: object
      required:
        - property
        - operator
        - value
      properties:
        property:
          type: string
          description: The event dimension to filter on.
          example: "pathname"
        operator:
          type: string
          enum: [eq, neq, in, not_in, contains, not_contains, starts_with, gt, gte, lt, lte]
        value:
          description: "The filter value. Type depends on `operator` and `property`."
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: number

    MetricName:
      type: string
      enum:
        - visitors
        - pageviews
        - sessions
        - bounce_rate
        - avg_duration
        - events
        - conversion_rate

    # -----------------------------------------------------------------------
    # ANALYTICS — RESPONSES
    # -----------------------------------------------------------------------

    AggregateMetricsResponse:
      type: object
      properties:
        period:
          $ref: "#/components/schemas/DateRange"
        metrics:
          type: object
          description: Computed metric values for the primary period.
          properties:
            visitors:
              type: integer
            pageviews:
              type: integer
            sessions:
              type: integer
            bounce_rate:
              type: number
              format: float
              description: Percentage (0–100).
            avg_duration:
              type: number
              format: float
              description: Average session duration in seconds.
            events:
              type: integer
            conversion_rate:
              type: number
              format: float
              description: Percentage of sessions that produced a `conversion` event (0–100).
        comparison:
          type: object
          description: "Present only when `compare_period` was specified."
          properties:
            period:
              $ref: "#/components/schemas/DateRange"
            metrics:
              type: object
              additionalProperties:
                type: number
            change_pct:
              type: object
              description: Percentage change vs primary period for each metric.
              additionalProperties:
                type: ["number", "null"]

    TimeSeriesResponse:
      type: object
      properties:
        interval:
          type: string
          enum: [minute, hour, day, week, month]
        period:
          $ref: "#/components/schemas/DateRange"
        series:
          type: array
          items:
            type: object
            properties:
              bucket:
                type: string
                format: date-time
                description: Start of the time bucket (UTC).
              metrics:
                type: object
                additionalProperties:
                  type: number

    BreakdownResponse:
      type: object
      properties:
        property:
          type: string
        period:
          $ref: "#/components/schemas/DateRange"
        rows:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
                description: "The dimension value (e.g., pathname `/blog/post-1`)."
              metrics:
                type: object
                additionalProperties:
                  type: number
        total_rows:
          type: integer
          description: Total number of distinct values for this dimension in the period (before limit).

    RealtimeResponse:
      type: object
      properties:
        current_visitors:
          type: integer
          description: Unique visitors active in the last 5 minutes.
        top_pages:
          type: array
          maxItems: 10
          items:
            type: object
            properties:
              pathname:
                type: string
              visitors:
                type: integer
        top_sources:
          type: array
          maxItems: 10
          items:
            type: object
            properties:
              referrer_domain:
                type: string
              visitors:
                type: integer
        updated_at:
          type: string
          format: date-time

    RealtimeEvent:
      type: object
      description: One newly ingested event, pushed on the realtime SSE stream's `event` channel.
      properties:
        timestamp:
          type: string
          format: date-time
        event_name:
          type: string
        pathname:
          type: string
        referrer_source:
          type: string
        country:
          type: string
        device_type:
          type: string
        browser:
          type: string

    FunnelQueryRequest:
      type: object
      description: |
        Runs a saved funnel over a date range. The funnel's steps are defined by the
        persisted funnel (`funnel_id`); they are not supplied inline.
      required:
        - date_from
        - date_to
        - funnel_id
      properties:
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        funnel_id:
          type: string
          description: ID of a saved funnel (see `POST /sites/{site_id}/funnels`).
        conversion_window_days:
          type: integer
          description: Maximum number of days between the first and last step.
          minimum: 1
          maximum: 90
          default: 30
        filters:
          type: array
          description: Optional filters applied to the whole funnel (e.g. segment by device).
          items:
            $ref: "#/components/schemas/Filter"
        segment_id:
          type: string
          description: Optional saved segment applied to the funnel population.

    FunnelStep:
      type: object
      description: One step of a persisted funnel definition.
      required:
        - step_index
        - trigger_type
      properties:
        step_index:
          type: integer
          description: 0-based ordinal of the step within the funnel.
          minimum: 0
        label:
          type: string
          description: Human-readable label for display in the dashboard.
          maxLength: 100
        trigger_type:
          type: string
          enum: [pageview, event]
          description: |
            `pageview` — the step matches when a pageview's `pathname` matches `url_pattern`.
            `event` — the step matches when an event's name equals `event_name`.
        url_pattern:
          type: string
          description: "URL/path pattern (supports `*`). Required when `trigger_type` is `pageview`."
        event_name:
          type: string
          description: "Event name to match. Required when `trigger_type` is `event`."
        filters:
          type: array
          description: Additional filter conditions for this specific step.
          items:
            $ref: "#/components/schemas/Filter"

    Funnel:
      type: object
      description: A persisted, named funnel (`postgres.funnels`).
      properties:
        id:
          type: string
        site_id:
          type: string
        name:
          type: string
        steps:
          type: array
          minItems: 2
          maxItems: 16
          items:
            $ref: "#/components/schemas/FunnelStep"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FunnelCreateRequest:
      type: object
      required:
        - name
        - steps
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        steps:
          type: array
          minItems: 2
          maxItems: 16
          items:
            $ref: "#/components/schemas/FunnelStep"

    Goal:
      type: object
      description: A persisted conversion goal (`postgres.goals`).
      properties:
        id:
          type: string
        site_id:
          type: string
        name:
          type: string
        trigger_type:
          type: string
          enum: [pageview, event]
        url_pattern:
          type: ["string", "null"]
          description: "URL pattern (supports `*`). Set when `trigger_type` is `pageview`."
        event_name:
          type: ["string", "null"]
          description: "Event name to match. Set when `trigger_type` is `event`."
        currency:
          type: ["string", "null"]
          description: ISO-4217 currency for revenue attribution, if any.
        revenue_value:
          type: ["number", "null"]
          description: Static revenue value per conversion, or null when revenue is tracked dynamically.
        created_at:
          type: string
          format: date-time

    GoalCreateRequest:
      type: object
      required:
        - name
        - trigger_type
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        trigger_type:
          type: string
          enum: [pageview, event]
        url_pattern:
          type: string
          description: "Required when `trigger_type` is `pageview`."
        event_name:
          type: string
          description: "Required when `trigger_type` is `event`."
        currency:
          type: string
          maxLength: 3
        revenue_value:
          type: number

    FunnelResponse:
      type: object
      properties:
        period:
          $ref: "#/components/schemas/DateRange"
        conversion_window_days:
          type: integer
        steps:
          type: array
          items:
            type: object
            properties:
              step_index:
                type: integer
                description: 0-based step index.
              label:
                type: string
              event_name:
                type: string
              entered:
                type: integer
                description: Number of users who entered this step.
              converted:
                type: integer
                description: Number of users who completed this step.
              dropped:
                type: integer
                description: Number of users who dropped off at this step.
              conversion_rate_pct:
                type: number
                format: float
                description: Percentage of entrants who completed this step.
              avg_time_to_convert_seconds:
                type: number
                description: Average time to complete this step from the previous step.

    RetentionQueryRequest:
      type: object
      required:
        - date_from
        - date_to
      properties:
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        interval:
          type: string
          enum: [week, month]
          default: week
        return_event:
          type: string
          description: "Event name that counts as a \"return\". Defaults to `pageview`."
          default: pageview

    RetentionResponse:
      type: object
      properties:
        interval:
          type: string
          enum: [week, month]
        cohorts:
          type: array
          description: One entry per cohort period.
          items:
            type: object
            properties:
              cohort_date:
                type: string
                format: date
              cohort_size:
                type: integer
              retention:
                type: array
                description: Retention rate for each subsequent period (period 0 = 100%).
                items:
                  type: object
                  properties:
                    period:
                      type: integer
                    retained_count:
                      type: integer
                    retention_pct:
                      type: number
                      format: float

    HeatmapQueryRequest:
      type: object
      required:
        - date_from
        - date_to
        - pathname
      properties:
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        pathname:
          type: string
          description: "Exact pathname or glob pattern (e.g., `/blog/*`)."
          maxLength: 2048
        viewport_width_min:
          type: integer
          minimum: 0
          description: Filter to events from viewports at least this wide.
        viewport_width_max:
          type: integer
          maximum: 10000
          description: Filter to events from viewports no wider than this.
        heatmap_type:
          type: string
          enum: [click, scroll]
          default: click

    HeatmapResponse:
      type: object
      properties:
        pathname:
          type: string
        period:
          $ref: "#/components/schemas/DateRange"
        heatmap_type:
          type: string
          enum: [click, scroll]
        total_events:
          type: integer
        click_points:
          type: array
          description: Aggregated click buckets. Each bucket is a 10x10px normalised grid cell.
          items:
            type: object
            properties:
              x_pct:
                type: number
                format: float
                description: Horizontal position as percentage of page width (bucket centre).
              y_pct:
                type: number
                format: float
                description: Vertical position as percentage of page height (bucket centre).
              count:
                type: integer
                description: Number of clicks in this bucket.
              weight:
                type: number
                format: float
                description: Normalised weight (0–1) relative to the highest-count bucket.
        scroll_depths:
          type: array
          description: Distribution of maximum scroll depth reached (present for scroll heatmaps).
          items:
            type: object
            properties:
              depth_pct:
                type: integer
                description: Scroll depth bucket (0, 10, 20, ..., 100).
              sessions_pct:
                type: number
                format: float
                description: Percentage of sessions that reached at least this depth.

    # -----------------------------------------------------------------------
    # ANALYTICS — SEGMENTS
    # -----------------------------------------------------------------------

    Segment:
      type: object
      properties:
        id:
          type: string
        site_id:
          type: string
        name:
          type: string
        filters:
          type: array
          items:
            $ref: "#/components/schemas/Filter"
        filter_combination:
          type: string
          enum: [and, or]
        created_by:
          type: string
          description: User ID.
        created_at:
          type: string
          format: date-time

    SegmentCreateRequest:
      type: object
      required:
        - name
        - filters
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        filters:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Filter"
        filter_combination:
          type: string
          enum: [and, or]
          default: and

    # -----------------------------------------------------------------------
    # REPORTING
    # -----------------------------------------------------------------------

    SavedReport:
      type: object
      properties:
        id:
          type: string
        site_id:
          type: string
        name:
          type: string
        description:
          type: string
        report_type:
          type: string
          enum: [aggregate, timeseries, breakdown, funnel, retention, heatmap]
        query:
          type: object
          description: Serialised query parameters for the saved report.
          additionalProperties: true
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SavedReportCreateRequest:
      type: object
      required:
        - name
        - report_type
        - query
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        report_type:
          type: string
          enum: [aggregate, timeseries, breakdown, funnel, retention, heatmap]
        query:
          type: object
          additionalProperties: true

    ScheduledReport:
      type: object
      properties:
        id:
          type: string
        site_id:
          type: string
        saved_report_id:
          type: ["string", "null"]
          description: Optional reference to a saved report config.
        name:
          type: string
        recipients:
          type: array
          items:
            type: string
            format: email
        schedule_cron:
          type: string
          description: Cron expression for the send schedule (UTC).
          example: "0 9 * * 1"
        timezone:
          type: string
          description: Timezone for the cron schedule.
          example: "Europe/Paris"
        is_active:
          type: boolean
        last_sent_at:
          type: ["string", "null"]
          format: date-time
        next_send_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    ScheduledReportCreateRequest:
      type: object
      required:
        - name
        - recipients
        - schedule_cron
        - timezone
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        saved_report_id:
          type: string
        recipients:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: email
        schedule_cron:
          type: string
          description: "Standard 5-part cron expression (UTC). Minimum interval: daily."
        timezone:
          type: string

    ScheduledReportUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        recipients:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: email
        schedule_cron:
          type: string
        timezone:
          type: string
        is_active:
          type: boolean

    Alert:
      type: object
      properties:
        id:
          type: string
        site_id:
          type: string
        name:
          type: string
        metric:
          $ref: "#/components/schemas/MetricName"
        condition:
          type: string
          enum: [above, below, change_pct_above, change_pct_below]
        threshold:
          type: number
        comparison_period:
          type: string
          enum: [previous_day, previous_week, previous_month]
          description: Reference period for percentage-change conditions.
        filters:
          type: array
          items:
            $ref: "#/components/schemas/Filter"
        notification_channels:
          type: array
          items:
            $ref: "#/components/schemas/NotificationChannel"
        is_active:
          type: boolean
        last_triggered_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    AlertCreateRequest:
      type: object
      required:
        - name
        - metric
        - condition
        - threshold
        - notification_channels
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        metric:
          $ref: "#/components/schemas/MetricName"
        condition:
          type: string
          enum: [above, below, change_pct_above, change_pct_below]
        threshold:
          type: number
        comparison_period:
          type: string
          enum: [previous_day, previous_week, previous_month]
        filters:
          type: array
          items:
            $ref: "#/components/schemas/Filter"
        notification_channels:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/NotificationChannel"

    AlertUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        condition:
          type: string
          enum: [above, below, change_pct_above, change_pct_below]
        threshold:
          type: number
        is_active:
          type: boolean
        notification_channels:
          type: array
          items:
            $ref: "#/components/schemas/NotificationChannel"

    NotificationChannel:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [email, webhook, slack]
        email:
          type: string
          format: email
          description: "Required when `type` is `email`."
        webhook_url:
          type: string
          format: uri
          description: "Required when `type` is `webhook` or `slack`."

    Export:
      type: object
      properties:
        id:
          type: string
        site_id:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        format:
          type: string
          enum: [csv, ndjson]
        query:
          type: object
          additionalProperties: true
        row_count:
          type: ["integer", "null"]
          description: "Present when status is `completed`."
        file_size_bytes:
          type: ["integer", "null"]
        download_url:
          type: ["string", "null"]
          format: uri
          description: "Pre-signed download URL. Present and valid for 1 hour when status is `completed`."
        expires_at:
          type: ["string", "null"]
          format: date-time
          description: When the download URL expires.
        error_message:
          type: ["string", "null"]
          description: "Human-readable error description when status is `failed`."
        created_at:
          type: string
          format: date-time
        completed_at:
          type: ["string", "null"]
          format: date-time

    ExportCreateRequest:
      type: object
      required:
        - format
        - query
      properties:
        format:
          type: string
          enum: [csv, ndjson]
        query:
          type: object
          description: Query parameters (same shape as the corresponding analytics query endpoint body).
          additionalProperties: true
        notify_email:
          type: string
          format: email
          description: Optional email to notify when the export is ready.

    # -----------------------------------------------------------------------
    # SHARED
    # -----------------------------------------------------------------------

    DateRange:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        pagination:
          type: object
          properties:
            next_cursor:
              type: ["string", "null"]
            prev_cursor:
              type: ["string", "null"]
            has_next:
              type: boolean
            has_prev:
              type: boolean
            limit:
              type: integer

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - trace_id
      properties:
        type:
          type: string
          format: uri
          example: "https://statflow.io/errors/validation-failed"
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        trace_id:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string

  # =========================================================================
  # RESPONSES (reusable)
  # =========================================================================

  responses:

    BadRequest:
      description: Bad Request — malformed JSON or unknown fields.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://statflow.io/errors/malformed-json"
            title: "Malformed JSON"
            status: 400
            trace_id: "01HXK2Q4B7T8NMPZW6RDYGJ5FM"

    Unauthorized:
      description: Unauthorized — missing or invalid authentication credential.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://statflow.io/errors/authentication-required"
            title: "Authentication Required"
            status: 401
            trace_id: "01HXK2Q4B7T8NMPZW6RDYGJ5FM"

    Forbidden:
      description: Forbidden — authenticated but insufficient permission.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://statflow.io/errors/permission-denied"
            title: "Permission Denied"
            status: 403
            trace_id: "01HXK2Q4B7T8NMPZW6RDYGJ5FM"

    NotFound:
      description: Not Found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://statflow.io/errors/not-found"
            title: "Not Found"
            status: 404
            trace_id: "01HXK2Q4B7T8NMPZW6RDYGJ5FM"

    Conflict:
      description: Conflict — duplicate resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://statflow.io/errors/conflict"
            title: "Conflict"
            status: 409
            trace_id: "01HXK2Q4B7T8NMPZW6RDYGJ5FM"

    UnprocessableEntity:
      description: Unprocessable Entity — business rule validation failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://statflow.io/errors/validation-failed"
            title: "Validation Failed"
            status: 422
            trace_id: "01HXK2Q4B7T8NMPZW6RDYGJ5FM"
            errors:
              - field: "data_retention_days"
                code: "out_of_range"
                message: "data_retention_days must be between 30 and 730."

    PayloadTooLarge:
      description: Payload Too Large — event exceeds size limit.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://statflow.io/errors/event-payload-too-large"
            title: "Event Payload Too Large"
            status: 413
            trace_id: "01HXK2Q4B7T8NMPZW6RDYGJ5FM"

    TooManyRequests:
      description: Too Many Requests — rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://statflow.io/errors/rate-limit-exceeded"
            title: "Rate Limit Exceeded"
            status: 429
            trace_id: "01HXK2Q4B7T8NMPZW6RDYGJ5FM"

    ServiceUnavailable:
      description: Service Unavailable — upstream dependency (ClickHouse/PostgreSQL) unreachable.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://statflow.io/errors/dependency-unavailable"
            title: "Dependency Unavailable"
            status: 503
            trace_id: "01HXK2Q4B7T8NMPZW6RDYGJ5FM"

    GatewayTimeout:
      description: Gateway Timeout — analytics query exceeded maximum execution time.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "https://statflow.io/errors/query-timeout"
            title: "Query Timeout"
            status: 504
            trace_id: "01HXK2Q4B7T8NMPZW6RDYGJ5FM"
