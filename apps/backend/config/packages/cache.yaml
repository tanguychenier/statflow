framework:
    cache:
        # The "app" cache stores to the filesystem by default and persists between
        # deploys. Point default_redis_provider + app at Redis in production via
        # environment overrides if a shared cache is required.
        app: cache.adapter.filesystem

        pools:
            # Tag-aware pool backing the Analytics query-result cache: entries are
            # tagged with their site so a whole site's memoised aggregates can be
            # dropped atomically when fresh events land (TaggedQueryCache).
            cache.analytics:
                adapter: cache.app
                tags: true
